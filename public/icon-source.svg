<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#gradient)"/>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Document/Resume Icon -->
  <g transform="translate(128, 96)">
    <!-- Paper background -->
    <rect x="0" y="0" width="256" height="320" rx="16" fill="white" opacity="0.95"/>

    <!-- Document lines -->
    <rect x="32" y="40" width="192" height="12" rx="6" fill="#6366f1" opacity="0.8"/>
    <rect x="32" y="72" width="192" height="12" rx="6" fill="#6366f1" opacity="0.5"/>
    <rect x="32" y="104" width="144" height="12" rx="6" fill="#6366f1" opacity="0.5"/>

    <!-- Sparkles/AI indicator -->
    <g transform="translate(200, 240)">
      <!-- Main star -->
      <path d="M 0,-20 L 4,-6 L 18,-4 L 6,4 L 8,18 L 0,10 L -8,18 L -6,4 L -18,-4 L -4,-6 Z"
            fill="#fbbf24" opacity="0.95"/>

      <!-- Small stars -->
      <circle cx="30" cy="-10" r="4" fill="#fbbf24" opacity="0.8"/>
      <circle cx="-30" cy="10" r="3" fill="#fbbf24" opacity="0.8"/>
      <circle cx="25" cy="20" r="3" fill="#fbbf24" opacity="0.7"/>
    </g>

    <!-- Checkmarks (indicating optimization) -->
    <g opacity="0.7">
      <path d="M 40,180 L 50,190 L 70,165" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 40,220 L 50,230 L 70,205" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 40,260 L 50,270 L 70,245" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Text lines for bullets -->
    <rect x="90" y="180" width="120" height="8" rx="4" fill="#6366f1" opacity="0.4"/>
    <rect x="90" y="220" width="100" height="8" rx="4" fill="#6366f1" opacity="0.4"/>
    <rect x="90" y="260" width="130" height="8" rx="4" fill="#6366f1" opacity="0.4"/>
  </g>
</svg>
